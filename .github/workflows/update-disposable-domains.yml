name: Update disposable email blocklist

on:
  schedule:
    - cron: '0 4 1 * *'   # monthly on the 1st at 04:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update blocklist
        run: bash scripts/update-disposable-domains.sh

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/HookSentry.Api/Resources/disposable-domains.txt
          git diff --cached --quiet || git commit -m "chore: update disposable email blocklist [skip ci]"
          git push
