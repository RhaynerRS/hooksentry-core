services:
  api:
    build:
      context: .
      dockerfile: src/HookSentry.Api/dockerfile
    ports:
      - "5143:5143"
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 225M
        reservations:
          cpus: '0.20'
          memory: 128M
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Your_database;Username=Your_username;Password=Your_password123
      - ConnectionStrings__Redis=redis:6379,user=default,password=Your_redis_password,abortConnect=false
      - Jwt__Key=Q29ubmVjdGlvblN0cmluZ3NfX0RlZmF1bHRDb25uZWN0aW9uPUhvc3Q9cG9zdGdyZXM7UG9ydD01NDMyO0RhdGFiYXNlPVlvdXJfZGF0YWJhc2U7VXNlcm5hbWU9WW91cl91c2VybmFtZTtQYXNzd29yZD1Zb3VyX3Bhc3N3b3JkMTIz
      - ApiKey__Value=change-this-api-key
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=Your_username
      - RabbitMq__Password=Your_password123
      - CredentialEncryption__Key=YTNmOGMyZDFlNGI3MDkxZjZhNWQzZTJjOGYxYjRhNzA=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "service_name=hooksentry-api"

  worker:
    build:
      context: .
      dockerfile: src/HookSentry.Worker/dockerfile
    ports:
      - "7143:7143"
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 225M
        reservations:
          cpus: '0.20'
          memory: 128M
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Your_database;Username=Your_username;Password=Your_password123
      - ConnectionStrings__Redis=redis:6379,user=default,password=Your_redis_password,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=Your_username
      - RabbitMq__Password=Your_password123
      - CredentialEncryption__Key=YTNmOGMyZDFlNGI3MDkxZjZhNWQzZTJjOGYxYjRhNzA=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "service_name=hooksentry-worker"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    environment:
      RABBITMQ_DEFAULT_USER: "Your_username"
      RABBITMQ_DEFAULT_PASS: "Your_password123"
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK_ABSOLUTE: "120MiB"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:latest
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=8MB
      -c effective_cache_size=64MB
      -c max_connections=20
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    environment:
      POSTGRES_PASSWORD: "Your_password123"
      POSTGRES_USER: "Your_username"
      POSTGRES_DB: "Your_database"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Your_username -d Your_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
    command: >
      redis-server
      --requirepass Your_redis_password
      --maxmemory 36mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Your_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
