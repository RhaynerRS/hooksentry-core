services:
  api:
    build:
      context: .
      dockerfile: src/HookSentry.Api/dockerfile
    ports:
      - "5143:5143"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Your_database;Username=Your_username;Password=Your_password123
      - ConnectionStrings__Redis=redis:6379,user=default,password=Your_redis_password,abortConnect=false
      - Jwt__Key=YTNmOGMyZDFlNGI3MDkxZjZhNWQzZTJjOGYxYjRhNzA=
      - ApiKey__Value=change-this-api-key
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=Your_username
      - RabbitMq__Password=Your_password123
      - CredentialEncryption__Key=YTNmOGMyZDFlNGI3MDkxZjZhNWQzZTJjOGYxYjRhNzA=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "service_name=hooksentry-api"

  worker:
    build:
      context: .
      dockerfile: src/HookSentry.Worker/dockerfile
    ports:
      - "7143:7143"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Your_database;Username=Your_username;Password=Your_password123
      - ConnectionStrings__Redis=redis:6379,user=default,password=Your_redis_password,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=Your_username
      - RabbitMq__Password=Your_password123
      - CredentialEncryption__Key=YTNmOGMyZDFlNGI3MDkxZjZhNWQzZTJjOGYxYjRhNzA=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "service_name=hooksentry-worker"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "Your_username"
      RABBITMQ_DEFAULT_PASS: "Your_password123"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: "Your_password123"
      POSTGRES_USER: "Your_username"
      POSTGRES_DB: "Your_database"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Your_username -d Your_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --requirepass Your_redis_password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Your_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:latest
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - tempo_data:/var/tempo
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/loki.yml
    depends_on:
      - loki

configs:
  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          jsonData:
            derivedFields:
              - name: TraceId
                matcherRegex: '"TraceId":"(\w+)"'
                url: '$${__value.raw}'
                datasourceUid: tempo
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          uid: tempo

volumes:
  grafana_data:
  tempo_data:
